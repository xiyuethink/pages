name: Markdown Check

on:
  push:
    branches: ["**"]
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-check.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-check.yml"

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: markdownlint.json
          globs: "**/*.md"
